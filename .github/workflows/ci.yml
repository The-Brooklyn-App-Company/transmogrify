name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax checks
        shell: bash
        run: |
          for file in scripts/*.js scripts/lib/*.js test/*.js test/helpers/*.js; do
            node --check "$file"
          done
          for file in scripts/*.sh install.sh; do
            bash -n "$file"
          done
      - run: npm pack --dry-run

  # The operations layer (ops/): POSIX sh under sh and dash, shellcheck and
  # the kit's own gate. No network and no model calls: the agent CLIs are
  # fakes (test/ops/fakes).
  ops:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -yq dash shellcheck jq
          else
            command -v shellcheck >/dev/null || brew install shellcheck
            command -v jq >/dev/null || brew install jq
          fi
          dash -c 'echo dash ok' && shellcheck --version | head -2 && jq --version
      - name: check.sh kit
        run: sh ops/check.sh kit
      - name: Leak guard (generic rules; the private denylist runs on maintainer machines)
        run: sh ops/check.sh leaks --no-denylist
      - name: shellcheck
        shell: bash
        run: |
          shellcheck ops/*.sh ops/lib/*.sh ops/adapters/*.sh \
            ops/examples/hooks/*/* ops/examples/tracker-linear/*.sh \
            test/ops/*.sh test/ops/fakes/fake-agent
      - name: Kit suite (sh and dash)
        run: AO_TEST_SHELLS="sh dash" sh test/ops/run.sh
